server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 6m;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /health/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
  location / { try_files $uri $uri/ /index.html; }
}
